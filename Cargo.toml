[package]
name = "fasts3_rust_cli"
version = "0.1.0"
edition = "2024"
description = "Complete asynchronous Rust client library (SDK) for the FastS3 storage server API"
license = "MIT"
repository = "https://github.com/PTechSoftware/fasts3"

[dependencies]
base64 = "0.22"
bytes = "1.7"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
